openapi: 3.2.0
info:
  title: Bookings API
  version: 2.0.0
  description: Room bookings for the StayFlow property platform (sample).
servers:
- url: https://api.stayflow.example/v1
security:
- apiKey: []
paths:
  /bookings:
    get:
      operationId: listBookings
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - confirmed
          - cancelled
          - no_show
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: tags
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: propertyId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Bookings
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/Booking'
    post:
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBooking'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: *id001
        '400':
          description: Invalid booking
  /bookings/{bookingId}:
    parameters:
    - name: bookingId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getBooking
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema: *id001
        '404':
          description: Not found
    delete:
      operationId: cancelBooking
      responses:
        '204':
          description: Cancelled
components:
  schemas:
    Booking:
      type: object
      required:
      - id
      - guest
      - nights
      - status
      properties:
        id:
          type: string
        guest:
          type: string
          maxLength: 80
        nights:
          type: integer
          exclusiveMinimum: 0
        status:
          type: string
          enum:
          - pending
          - confirmed
          - cancelled
          - no_show
        checkIn:
          type: string
          format: date
        notes:
          type:
          - string
          - 'null'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
    NewBooking:
      type: object
      required:
      - guest
      - nights
      - checkIn
      properties:
        guest:
          type: string
          maxLength: 50
        nights:
          type: integer
          exclusiveMinimum: 0
        checkIn:
          type: string
          format: date
        notes:
          type:
          - string
          - 'null'
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
