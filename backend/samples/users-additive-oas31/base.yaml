openapi: 3.1.0
info:
  title: Users API
  version: 2.1.0
  description: Guest profiles for the StayFlow apps (sample).
servers:
  - url: https://users.stayflow.example
paths:
  /users:
    get:
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  next:
                    type: [string, 'null']
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getUser
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
        displayName:
          type: string
        locale:
          type: string
    UserUpdate:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 60
        locale:
          type: string
